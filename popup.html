<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg:        #1a1a1a;
      --surface:   #242424;
      --hover:     #2e2e2e;
      --border:    #2e2e2e;
      --text:      #e8e8e8;
      --dim:       #888;
      --ao3-red:   #990000;
      --purple:    #7c6af7;
      --gold:      #d4a017;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', sans-serif;
      font-size: 13px;
    }

    /* ── Header ── */
    .header {
      background: var(--surface);
      padding: 10px 14px 8px;
      border-bottom: 1px solid var(--border);
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #refreshBtn {
      font-size: 16px;
      cursor: pointer;
      color: var(--dim);
      transition: color 0.2s, transform 0.35s;
      line-height: 1;
    }
    #refreshBtn:hover { color: var(--text); transform: rotate(180deg); }
    #refreshBtn.spinning { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    #markAllRead {
      font-size: 11px;
      color: var(--dim);
      cursor: pointer;
      text-decoration: underline;
    }
    #clearAll {
      font-size: 11px;
      color: var(--ao3-red);
      cursor: pointer;
      font-weight: 600;
    }
    #lastSync {
      font-size: 10px;
      color: var(--dim);
      margin-top: 4px;
    }

    /* ── Sync progress ── */
    .sync-status {
      margin-top: 6px;
    }
    .sync-bar-track {
      width: 100%;
      height: 3px;
      background: #333;
      border-radius: 2px;
      overflow: hidden;
    }
    .sync-bar-fill {
      height: 100%;
      background: var(--purple);
      width: 0%;
      transition: width 0.3s ease;
    }
    .sync-status-text {
      font-size: 10px;
      color: var(--purple);
      margin-top: 4px;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 9px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      color: var(--dim);
      transition: color 0.15s;
      letter-spacing: 0.3px;
    }
    .tab.active {
      color: var(--text);
      border-bottom: 2px solid var(--ao3-red);
    }

    /* ── Search ── */
    .search-wrap {
      padding: 8px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-wrap::before {
      content: '🔍';
      font-size: 12px;
      flex-shrink: 0;
    }
    #searchBar {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 12px;
      placeholder-color: var(--dim);
    }
    #searchBar::placeholder { color: var(--dim); }

    /* ── Add input ── */
    .input-box {
      padding: 10px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    textarea {
      width: 100%;
      height: 42px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      padding: 6px 8px;
      resize: none;
      font-size: 11px;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: #555; }
    #addBtn {
      width: 100%;
      margin-top: 7px;
      padding: 7px;
      background: var(--ao3-red);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: background 0.2s;
    }
    #addBtn:hover { background: #b30000; }

    /* ── List counter ── */
    .list-header {
      padding: 6px 14px;
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }

    /* ── Feed list ── */
    .update-list {
      max-height: 360px;
      overflow-y: auto;
    }
    .update-list::-webkit-scrollbar { width: 3px; }
    .update-list::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 2px; }

    /* ── Each chapter row ── */
    .chapter-row {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
      gap: 10px;
    }
    .chapter-row:hover { background: var(--hover); }

    .row-info { flex: 1; min-width: 0; }

    .row-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    /* Chapter number tag — matches reference "c731" style */
    .chap-tag {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      background: #333;
      padding: 1px 6px;
      border-radius: 4px;
    }

    .row-meta {
      font-size: 11px;
      color: var(--dim);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* "AO3" pill — mirrors the "n" (Novel Updates) badge in the reference */
    .source-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--ao3-red);
      color: white;
      font-size: 9px;
      font-weight: 700;
      width: 20px;
      height: 16px;
      border-radius: 3px;
      letter-spacing: 0.2px;
    }

    .dot-sep { color: #555; }

    /* Unread dot — purple circle on the right, matches reference */
    .unread-dot {
      color: var(--purple);
      font-size: 10px;
      flex-shrink: 0;
      line-height: 1;
    }

    /* Mark-as-read button — shows on hover, replaces dot */
    .mark-btn {
      background: transparent;
      border: none;
      color: var(--purple);
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
    }
    .chapter-row:hover .mark-btn { opacity: 1; }
    .mark-btn:hover { color: white; }

    /* Chapter range badge (All Tracked view) */
    .not-found-badge {
      font-size: 10px;
      font-weight: 700;
      color: #ffaa00;
      background: rgba(255,170,0,0.12);
      border: 1px solid rgba(255,170,0,0.3);
      padding: 1px 5px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .chapter-range {
      font-size: 11px;
      font-weight: 700;
      color: var(--gold);
      background: rgba(212,160,23,0.12);
      padding: 1px 6px;
      border-radius: 4px;
    }
    .chapter-single {
      font-size: 11px;
      color: var(--dim);
    }

    /* Remove button (All Tracked) */
    .remove-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 13px;
      opacity: 0;
      padding: 3px;
      transition: opacity 0.15s;
    }
    .chapter-row:hover .remove-btn { opacity: 1; }

    .empty-msg {
      padding: 24px;
      text-align: center;
      color: var(--dim);
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-row">
      <div class="header-title">AO3 Tracker</div>
      <div class="header-actions">
        <span id="markAllRead">Mark All Read</span>
        <span id="clearAll">Delete All</span>
        <span id="refreshBtn" title="Check for updates now">↻</span>
      </div>
    </div>
    <div id="lastSync">No sync yet</div>
    <div id="syncStatus" class="sync-status" style="display:none;">
      <div class="sync-bar-track"><div id="syncBarFill" class="sync-bar-fill"></div></div>
      <div id="syncStatusText" class="sync-status-text"></div>
    </div>
  </div>

  <div class="tabs">
    <div id="tabUpdates" class="tab active">Updates</div>
    <div id="tabAll" class="tab">All Tracked</div>
  </div>

  <div class="search-wrap">
    <input type="text" id="searchBar" placeholder="Search...">
  </div>

  <div class="input-box">
    <textarea id="ficUrls" placeholder="Paste AO3 work or series links here…"></textarea>
    <button id="addBtn">+ Add to Tracker</button>
  </div>

  <div class="list-header"><span id="ficCount">0</span> entries</div>

  <div id="list" class="update-list"></div>

  <script src="popup.js"></script>
</body>
</html>
